<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="1"/>
    </radialGradient>

    <!-- Shield Border Gradient (KeeperHub Orange to Sentinel Emerald) -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff761c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Core Eye Gradient -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Orange Circuit Glow -->
    <filter id="neonOrangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Green Circuit Glow -->
    <filter id="neonGreenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" stroke="#1f293d" stroke-width="2"/>

  <!-- Subtle Circuit Traces in Background -->
  <g stroke="#ff761c" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <path d="M30 60 H70 L90 80 V120"/>
    <path d="M226 60 H186 L166 80 V120"/>
    <path d="M30 196 H70 L90 176 V136"/>
    <path d="M226 196 H186 L166 176 V136"/>
    <circle cx="30" cy="60" r="3" fill="#ff761c" fill-opacity="0.2"/>
    <circle cx="226" cy="60" r="3" fill="#ff761c" fill-opacity="0.2"/>
    <circle cx="30" cy="196" r="3" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="226" cy="196" r="3" fill="#10b981" fill-opacity="0.2"/>
  </g>

  <!-- Outer Cyber Shield -->
  <path d="M128 28 
           L206 58 
           V126 
           C206 178 168 214 128 228 
           C88 214 50 178 50 126 
           V58 
           Z" 
        fill="url(#shieldInner)" 
        stroke="url(#shieldBorder)" 
        stroke-width="5" 
        filter="url(#neonOrangeGlow)"/>

  <!-- Inner Inset Shield Ring -->
  <path d="M128 48 
           L186 70 
           V126 
           C186 166 156 195 128 206 
           C100 195 70 166 70 126 
           V70 
           Z" 
        fill="none" 
        stroke="#ff761c" 
        stroke-width="1.5" 
        stroke-opacity="0.4"
        stroke-dasharray="6 4"/>

  <!-- Central Sentinel Hex-Core (Autonomous Brain) -->
  <polygon points="128,84 164,104 164,146 128,166 92,146 92,104" 
           fill="#0f172a" 
           stroke="url(#coreGlow)" 
           stroke-width="3.5"
           filter="url(#neonGreenGlow)"/>

  <!-- Keyhole / Target Crosshair in Core -->
  <circle cx="128" cy="120" r="10" fill="url(#coreGlow)"/>
  <path d="M128 120 L128 142" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="128" cy="120" r="3.5" fill="#ffffff"/>

  <!-- Crosshair Accent Ticks -->
  <line x1="128" y1="94" x2="128" y2="100" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="150" x2="128" y2="156" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="102" y1="125" x2="108" y2="125" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="148" y1="125" x2="154" y2="125" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Invariant Node Gem -->
  <polygon points="128,38 134,47 128,56 122,47" fill="#ff761c"/>

  <!-- Bottom Lock Node Gem -->
  <circle cx="128" cy="218" r="3.5" fill="#10b981"/>
</svg>
