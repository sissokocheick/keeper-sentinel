<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="860" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#090f1d"/>
    </linearGradient>

    <!-- Shield Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff761c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="78%" stop-color="#ff761c"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Filters for High-Tech Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Container -->
  <rect width="860" height="160" rx="20" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Circuit Trace Accents -->
  <g stroke="#ff761c" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M160 30 H320 L340 50"/>
    <path d="M700 30 H820 L840 50"/>
    <path d="M400 130 H750 L770 110"/>
    <circle cx="160" cy="30" r="2.5" fill="#ff761c"/>
    <circle cx="840" cy="50" r="2.5" fill="#ff761c"/>
    <circle cx="770" cy="110" r="2.5" fill="#10b981"/>
  </g>

  <!-- Left: Shield Emblem (Scaled to fit 120x120 inside 160 height) -->
  <g transform="translate(25, 20) scale(0.48)">
    <!-- Outer Shield -->
    <path d="M128 28 L206 58 V126 C206 178 168 214 128 228 C88 214 50 178 50 126 V58 Z" 
          fill="#111827" stroke="url(#shieldGrad)" stroke-width="6" filter="url(#glow)"/>
    <!-- Inset Ring -->
    <path d="M128 48 L186 70 V126 C186 166 156 195 128 206 C100 195 70 166 70 126 V70 Z" 
          fill="none" stroke="#ff761c" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6 4"/>
    <!-- Core Hexagon -->
    <polygon points="128,84 164,104 164,146 128,166 92,146 92,104" 
             fill="#0f172a" stroke="url(#coreGrad)" stroke-width="4" filter="url(#glow)"/>
    <!-- Eye & Keyhole -->
    <circle cx="128" cy="120" r="11" fill="url(#coreGrad)"/>
    <path d="M128 120 L128 144" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="128" cy="120" r="4" fill="#ffffff"/>
  </g>

  <!-- Middle/Right: Typography & Branding -->
  <g transform="translate(165, 0)">
    <!-- Main Title -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#titleGrad)" letter-spacing="1">
      KEEPER<tspan fill="#ff761c">SENTINEL</tspan>
    </text>

    <!-- DoraHacks / Version Badge -->
    <g transform="translate(345, 34)">
      <rect width="110" height="24" rx="12" fill="#ff761c" fill-opacity="0.15" stroke="#ff761c" stroke-opacity="0.4" stroke-width="1"/>
      <text x="55" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#ff761c" text-anchor="middle">
        DoraHacks 2026
      </text>
    </g>

    <g transform="translate(465, 34)">
      <rect width="135" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="12" r="3.5" fill="#10b981"/>
      <text x="76" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">
        Live Base Sepolia
      </text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">
      Autonomous DeFi Risk Monitor + Deterministic Execution Engine
    </text>

    <!-- Metric Badges Row -->
    <g transform="translate(0, 108)">
      <!-- Badge 1: Contracts -->
      <g transform="translate(0, 0)">
        <rect width="150" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
        <text x="75" y="17" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">
          ⛓️ 3 Verified Contracts
        </text>
      </g>

      <!-- Badge 2: Tests -->
      <g transform="translate(160, 0)">
        <rect width="135" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
        <text x="67" y="17" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">
          🧪 68 Tests (100%)
        </text>
      </g>

      <!-- Badge 3: Gas Saved -->
      <g transform="translate(305, 0)">
        <rect width="165" height="26" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
        <text x="82" y="17" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">
          ⚡ 83.8% Gas Saved
        </text>
      </g>

      <!-- Badge 4: Non-Custodial -->
      <g transform="translate(480, 0)">
        <rect width="175" height="26" rx="6" fill="#431407" fill-opacity="0.5" stroke="#ea580c" stroke-opacity="0.5" stroke-width="1"/>
        <text x="87" y="17" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">
          🛡️ Turnkey MPC Guard
        </text>
      </g>
    </g>
  </g>
</svg>
