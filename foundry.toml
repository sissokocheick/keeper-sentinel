[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["node_modules"]
test = "contracts/test"
script = "contracts/script"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
baseSepolia = "https://sepolia.base.org"

[etherscan]
baseSepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
